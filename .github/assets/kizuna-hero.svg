    <path d="M1018 212C1054 234 1064 247 1104 247"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">
    <g transform="translate(650 116)">
      <rect width="118" height="74" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
      <text x="16" y="32" fill="#93c5fd" font-size="19" font-weight="700">POSTGRES</text>
      <text x="16" y="55" fill="#cbd5e1" font-size="16">tables · SQL</text>
    </g>
    <g transform="translate(650 210)">
      <rect width="118" height="74" rx="14" fill="#3f1418" stroke="#fb7185" stroke-width="2"/>
