<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Kizuna — единый интерфейс для PostgreSQL, Redis и Kafka</title>
  <desc id="desc">Три источника данных соединены через центральный узел связей Kizuna.</desc>
  <rect width="1200" height="400" rx="26" fill="#111827"/>
  <path d="M64 76H1136M64 324H1136" stroke="#334155" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">
    <text x="64" y="86" fill="#f59e0b" font-size="18" font-weight="700" letter-spacing="3">UNIFIED DATA WORKBENCH</text>
    <text x="64" y="170" fill="#f8fafc" font-size="62" font-weight="750">絆 kizuna</text>
    <text x="64" y="215" fill="#cbd5e1" font-size="24">Данные, сообщения и связи — вместе.</text>
    <text x="64" y="278" fill="#94a3b8" font-size="20">Browse · edit · produce · follow the relationship</text>
  </g>
  <g fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M718 153C760 153 770 166 804 188"/>
    <path d="M718 247C760 247 770 234 804 212"/>
